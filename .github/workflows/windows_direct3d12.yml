name: Windows (Direct3D12)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code and Engines
        uses: actions/checkout@v3
        with:
          submodules: recursive  # <--- THIS IS THE MAGIC LINE

      - name: Compile
        run: |
          node base/make -g direct3d11 --compile

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows
          path: |
            build/krom
            build/Krom
